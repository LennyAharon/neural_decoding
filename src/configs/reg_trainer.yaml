seed: 42

dirs:
  checkpoint_dir: checkpoints  
  log_dir: train_logs  
  data_dir: ibl_aligned  
  output_dir: results

training:
  num_epochs: 2000 # 300 # 2000 # was 2000 # currently 2000 and 0.01 is the best with 3 temporal rank 
  batch_size: 32  # 8

  device: gpu
  metric: val_metric
  mode: max
  enable_progress_bar: true
  load_local: true

model: 
  model_class: DECODER   
  target: reg           
  output_size: 100       

data:
  dataset_class: decoding 

  train_name: train   
  test_name: test     
  train_len: null     
  test_len: null      

  num_workers: 1

optimizer:
  lr: 0.01  # was 0.01
  scheduler: cosine  # step/cosine/linear
  weight_decay: 1.

tuner:
  num_epochs: 2000     
  num_samples: 30  # number of random models to sample from
  use_gpu: true    # false if not using ray tune on gpus
  num_workers: 1
  metric: val_metric
  mode: max
  enable_progress_bar: true